name: Community desktop builds
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, name: macOS-arm64}
          - {runner: windows-2022, name: Windows-x64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6==6.8.3 pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - name: Start the demo and inspect the generated menu offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python smoke_desktop.py
      - name: Build on macOS
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --windowed --name 'Codex Usage Tray' --osx-bundle-identifier com.amoghacloud.codex-usage-tray --add-data 'icon.svg:.' tray.py
          /usr/libexec/PlistBuddy -c 'Add :LSUIElement bool true' 'dist/Codex Usage Tray.app/Contents/Info.plist'
          codesign --force --sign - 'dist/Codex Usage Tray.app'
          'dist/Codex Usage Tray.app/Contents/MacOS/Codex Usage Tray' --demo --check
          ditto -c -k --keepParent 'dist/Codex Usage Tray.app' 'codex-usage-tray-macOS-arm64.zip'
      - name: Build on Windows
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --windowed --name 'Codex Usage Tray' --add-data 'icon.svg:.' tray.py
          $p = Start-Process -FilePath 'dist/Codex Usage Tray/Codex Usage Tray.exe' -ArgumentList '--demo','--check' -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Compress-Archive -Path 'dist/Codex Usage Tray' -DestinationPath 'codex-usage-tray-Windows-x64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: codex-usage-tray-${{ matrix.name }}
          path: codex-usage-tray-${{ matrix.name }}.zip
          if-no-files-found: error
