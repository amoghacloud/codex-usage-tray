name: Desktop preview
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the v0.2.0 preview on GitHub Releases
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, name: macOS-arm64}
          - {runner: windows-2022, name: Windows-x64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6==6.8.3 pyinstaller==6.16.0
      - run: python -m unittest discover -s tests -v
      - name: Start the demo and inspect the generated menu offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: python smoke_desktop.py
      - name: Build on macOS
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --windowed --name 'Codex Usage Tray' --osx-bundle-identifier com.amoghacloud.codex-usage-tray --add-data 'icon.svg:.' tray.py
          /usr/libexec/PlistBuddy -c 'Add :LSUIElement bool true' 'dist/Codex Usage Tray.app/Contents/Info.plist'
          codesign --force --sign - 'dist/Codex Usage Tray.app'
          'dist/Codex Usage Tray.app/Contents/MacOS/Codex Usage Tray' --demo --check
          ditto -c -k --keepParent 'dist/Codex Usage Tray.app' 'codex-usage-tray-macOS-arm64.zip'
      - name: Build on Windows
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --windowed --name 'Codex Usage Tray' --add-data 'icon.svg:.' tray.py
          $p = Start-Process -FilePath 'dist/Codex Usage Tray/Codex Usage Tray.exe' -ArgumentList '--demo','--check' -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Compress-Archive -Path 'dist/Codex Usage Tray' -DestinationPath 'codex-usage-tray-Windows-x64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: codex-usage-tray-${{ matrix.name }}
          path: codex-usage-tray-${{ matrix.name }}.zip
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codex-usage-tray-*
          merge-multiple: true
      - name: Publish or refresh preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "v0.2.0 already exists. Use a new version for subsequent builds."
          else
            gh release create v0.2.0 codex-usage-tray-*.zip --target "$TARGET" --prerelease --title 'v0.2.0 desktop preview' --notes 'First macOS Apple Silicon and Windows x64 tray builds. Automated checks cover the demo menu and packaging. Live account switching and native tray behavior need community testing. Install and sign in to Codex CLI before launching. The archives are not notarized or Windows publisher-signed.'
          fi
